<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katelyn's School Assistant</title>
<meta name="theme-color" content="#1F5C4C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="School">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <!-- ===== LOGIN ===== -->
  <div id="screen-login" class="login-wrap">
    <div class="login-title">Hi Katelyn 👋</div>
    <div class="login-sub">Enter your passcode to open your school assistant</div>
    <input id="passcode-input" type="tel" inputmode="numeric" maxlength="12" placeholder="••••" autocomplete="off">
    <button class="primary-btn" id="login-btn">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>

  <!-- ===== TODAY ===== -->
  <section id="screen-today" class="screen">
    <div class="today-header">
      <div>
        <div class="date" id="today-date">—</div>
        <div class="subdate" id="today-subdate">&nbsp;</div>
      </div>
      <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
    <div id="today-content"><div class="spinner"></div></div>
  </section>

  <!-- ===== WEEK ===== -->
  <section id="screen-week" class="screen">
    <h1 style="font-size:22px;margin-bottom:16px;">Weekly schedule</h1>
    <div class="day-tabs" id="week-day-tabs"></div>
    <ul class="period-list" id="week-period-list"></ul>
  </section>

  <!-- ===== ADD ===== -->
  <section id="screen-add" class="screen">
    <h1 style="font-size:22px;margin-bottom:16px;">Add something</h1>
    <div class="type-toggle">
      <button id="type-assignment" class="active" data-type="Assignment">Assignment</button>
      <button id="type-reminder" data-type="Reminder">Reminder</button>
    </div>

    <div id="subject-field">
      <label class="field-label">Subject</label>
      <div class="chip-row" id="subject-chips"></div>
    </div>

    <label class="field-label" for="details-input" id="details-label">Assignment details</label>
    <textarea id="details-input" placeholder="e.g. Pages 45-46, questions 1-10"></textarea>

    <label class="field-label" for="due-date-input">Due date</label>
    <input type="date" id="due-date-input">

    <button class="primary-btn" id="save-btn">Save</button>
  </section>

  <!-- ===== CALENDAR ===== -->
  <section id="screen-calendar" class="screen">
    <div class="cal-header">
      <button class="icon-btn" id="cal-prev" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="month-label" id="cal-month-label">—</div>
      <button class="icon-btn" id="cal-next" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-detail" id="cal-detail" style="display:none;"></div>
  </section>

  <!-- ===== TAB BAR ===== -->
  <nav class="tabbar" id="tabbar" style="display:none;">
    <button data-screen="today" class="active" aria-label="Today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>Today</span>
    </button>
    <button data-screen="week" aria-label="Week">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span>Week</span>
    </button>
    <button data-screen="add" aria-label="Add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Add</span>
    </button>
    <button data-screen="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="8" cy="15" r="1"/><circle cx="12" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>
      <span>Calendar</span>
    </button>
  </nav>

</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
